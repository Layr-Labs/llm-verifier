name: Shared retained-result score derivation

on:
  workflow_call:
    inputs:
      verifier_repository:
        type: string
        required: true
      verifier_revision:
        type: string
        required: true
      root_dir:
        type: string
        default: '.'
      config_path:
        type: string
        default: derivation.json
      submission_path:
        type: string
        default: submission
      score_path:
        type: string
        default: .yukon/score.json
      yukon_evaluation:
        type: string
        required: true
      yukon_accepted_results:
        type: string
        default: ''
      environment:
        type: string
        default: ''
    secrets:
      OPENAI_API_KEY:
        required: false
      VERIFIER_CHECKOUT_TOKEN:
        required: false
    outputs:
      helper_base64:
        value: ${{ jobs.prepare.outputs.helper_base64 }}
      helper_sha256:
        value: ${{ jobs.prepare.outputs.helper_sha256 }}
      package_artifact:
        value: ${{ jobs.prepare.outputs.package_artifact }}
      intake_artifact:
        value: ${{ jobs.prepare.outputs.intake_artifact }}
      intake_sha256:
        value: ${{ jobs.prepare.outputs.intake_sha256 }}
      derivation_artifact:
        value: ${{ jobs.derive.outputs.artifact }}
      review_run_id:
        value: ${{ jobs.prepare.outputs.run_id }}
      review_run_attempt:
        value: ${{ jobs.derive.outputs.run_attempt }}
      receipt_artifact:
        value: ${{ jobs.prepare.outputs.receipt_artifact }}

permissions:
  contents: read

jobs:
  prepare:
    name: Authenticate retained full claims and prepare inert derivation intake
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      intake_sha256: ${{ steps.intake.outputs.intake_sha256 }}
      helper_base64: ${{ steps.transfer.outputs.helper_base64 }}
      helper_sha256: ${{ steps.transfer.outputs.helper_sha256 }}
      run_id: ${{ github.run_id }}
      package_artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-derivation-package","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.package.outputs.artifact-id, steps.package.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      intake_artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-derivation-intake","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.intake_archive.outputs.artifact-id, steps.intake_archive.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      receipt_artifact: >-
        ${{ steps.receipt.outputs.artifact-id && format('{{"id":"{0}","name":"verifier-accepted-results","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.receipt.outputs.artifact-id, steps.receipt.outputs.artifact-digest, github.run_id, github.run_attempt) || '' }}
    env:
      VERIFIER_REPOSITORY: ${{ inputs.verifier_repository }}
      VERIFIER_REVISION: ${{ inputs.verifier_revision }}
      CANDIDATE_REVISION: ${{ github.sha }}
      CHALLENGE_REPOSITORY: ${{ github.repository }}
      ROOT_DIR: ${{ inputs.root_dir }}
      CONFIG_PATH: ${{ inputs.config_path }}
      SUBMISSION_PATH: ${{ inputs.submission_path }}
      SCORE_PATH: ${{ inputs.score_path }}
      YUKON_EVALUATION: ${{ inputs.yukon_evaluation }}
      YUKON_ACCEPTED_RESULTS: ${{ inputs.yukon_accepted_results }}
      EVALUATION_RUN: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - name: Require matching immutable workflow and implementation pins
        env:
          CALLED_WORKFLOW: ${{ toJSON(job) }}
        shell: bash
        run: |
          [[ "$VERIFIER_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$VERIFIER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          python3 - <<'PY'
          import json, os
          called = json.loads(os.environ["CALLED_WORKFLOW"])
          if called.get("workflow_repository") != os.environ["VERIFIER_REPOSITORY"] or called.get("workflow_sha") != os.environ["VERIFIER_REVISION"]:
              raise SystemExit("Called workflow and implementation pins must match")
          PY
      - name: Checkout actual dispatched challenge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: challenge
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned verifier source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.verifier_repository }}
          ref: ${{ inputs.verifier_revision }}
          token: ${{ secrets.VERIFIER_CHECKOUT_TOKEN || github.token }}
          path: verifier
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Build the pinned verifier wheel once
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip wheel --no-deps ./verifier --wheel-dir "$RUNNER_TEMP/llmv-wheel"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/llmv-wheel/*.whl
      - name: Authenticate old artifacts and snapshot the exact current candidate
        id: intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" derivation-workflow-prepare \
            --checkout "$GITHUB_WORKSPACE/challenge" --verifier-checkout "$GITHUB_WORKSPACE/verifier" \
            --candidate-revision "$CANDIDATE_REVISION" --verifier-revision "$VERIFIER_REVISION" \
            --root-dir "$ROOT_DIR" --config "$CONFIG_PATH" --submission "$SUBMISSION_PATH" \
            --score-path "$SCORE_PATH" --run-id "$EVALUATION_RUN" --repository "$CHALLENGE_REPOSITORY" \
            --archives "$RUNNER_TEMP/original-archives" --out "$RUNNER_TEMP/intake/intake.json" \
            --receipt-out "$RUNNER_TEMP/receipt/accepted-results-receipt.json"
      - name: Export trusted standalone same-run transfer helper
        id: transfer
        shell: bash
        run: |
          python3 -I "$GITHUB_WORKSPACE/verifier/scripts/artifact_transfer.py" emit-bootstrap
      - id: package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-derivation-package
          path: ${{ runner.temp }}/llmv-wheel/
          if-no-files-found: error
          retention-days: 7
      - id: intake_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-derivation-intake
          path: ${{ runner.temp }}/intake/
          if-no-files-found: error
          retention-days: 7
      - name: Retain this run's receipt without exporting an accepted claim
        id: receipt
        if: inputs.yukon_accepted_results != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verifier-accepted-results
          path: ${{ runner.temp }}/receipt/accepted-results-receipt.json
          if-no-files-found: error
          retention-days: 7

  derive:
    name: Review representation only (no checkout or candidate execution)
    needs: prepare
    environment: ${{ inputs.environment }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: >-
        ${{ format('{{"id":"{0}","name":"verifier-score-derivation","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.result.outputs.artifact-id, steps.result.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      run_attempt: ${{ github.run_attempt }}
    env:
      LLMV_EXPECTED_INTAKE: ${{ needs.prepare.outputs.intake_sha256 }}
    steps:
      - name: Bootstrap trusted artifact transfer before wheel download
        env:
          LLMV_TRANSFER_HELPER: ${{ needs.prepare.outputs.helper_base64 }}
          LLMV_TRANSFER_SHA256: ${{ needs.prepare.outputs.helper_sha256 }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          encoded = os.environ["LLMV_TRANSFER_HELPER"]
          if not encoded or len(encoded) > 87384:
              raise SystemExit("Invalid transfer helper size")
          data = base64.b64decode(encoded, validate=True)
          if len(data) > 65536 or hashlib.sha256(data).hexdigest() != os.environ["LLMV_TRANSFER_SHA256"]:
              raise SystemExit("Invalid transfer helper digest")
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".llmv-artifact-transfer"
          root.mkdir()
          with (root / "transfer.py").open("xb") as target:
              target.write(data)
          PY
          python3 -I "$GITHUB_WORKSPACE/.llmv-artifact-transfer/transfer.py" install-action
      - name: Download and verify the exact current-run package and intake
        uses: ./.llmv-artifact-transfer
        timeout-minutes: 4
        env:
          LLMV_ARTIFACTS: >-
            [
              {"artifact":${{ needs.prepare.outputs.package_artifact }},"path":"wheel"},
              {"artifact":${{ needs.prepare.outputs.intake_artifact }},"path":"intake"}
            ]
      - name: Install the verified wheel without network access
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Derive the score representation within the protected budget
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" derive-score \
            --intake "$RUNNER_TEMP/intake/intake.json" --out "$RUNNER_TEMP/derivation/derivation.json" \
            --failure-out "$RUNNER_TEMP/derivation-failure/failure.json"
      - id: result
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verifier-score-derivation
          path: ${{ runner.temp }}/derivation/
          if-no-files-found: error
          retention-days: 7
      - name: Retain derivation failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verifier-score-derivation-failure
          path: ${{ runner.temp }}/derivation-failure/failure.json
          if-no-files-found: ignore
          retention-days: 7
