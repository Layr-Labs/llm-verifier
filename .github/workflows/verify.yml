name: Shared mathematical verifier

on:
  workflow_call:
    inputs:
      verifier_repository:
        type: string
        required: true
      verifier_revision:
        type: string
        required: true
      root_dir:
        type: string
        default: '.'
      config_path:
        type: string
        default: verifier.json
      submission_path:
        type: string
        default: submission
      score_path:
        type: string
        default: .yukon/score.json
      yukon_accepted_results:
        type: string
        default: ''
      yukon_evaluation:
        type: string
        default: ''
    outputs:
      helper_base64:
        description: "Trusted standalone transfer helper, base64 encoded"
        value: ${{ jobs.prepare.outputs.helper_base64 }}
      helper_sha256:
        description: "SHA256 of the decoded transfer helper"
        value: ${{ jobs.prepare.outputs.helper_sha256 }}
      package_artifact:
        description: "Immutable package archive descriptor"
        value: ${{ jobs.prepare.outputs.package_artifact }}
      intake_artifact:
        description: "Immutable intake archive descriptor"
        value: ${{ jobs.prepare.outputs.intake_artifact }}
      dossier_artifact:
        description: "Immutable dossier archive descriptor"
        value: ${{ jobs.finalize.outputs.dossier_artifact }}
      intake_sha256:
        description: "Intake envelope digest, not the archive or file digest"
        value: ${{ jobs.prepare.outputs.intake_sha256 }}
      review_run_id:
        description: "Run that produced the selected review"
        value: ${{ jobs.prepare.outputs.run_id }}
      review_run_attempt:
        description: "Attempt that produced the selected review"
        value: ${{ jobs.initial_review.outputs.kind == 'followup' && jobs.final_review.outputs.run_attempt || jobs.initial_review.outputs.run_attempt }}
      initial_review_run_attempt:
        description: "Initial review producer attempt"
        value: ${{ jobs.initial_review.outputs.run_attempt }}
      final_review_run_attempt:
        description: "Final review producer attempt, empty for direct judgments"
        value: ${{ jobs.final_review.outputs.run_attempt }}
      review_kind:
        description: "Initial review kind: judgment or followup"
        value: ${{ jobs.initial_review.outputs.kind }}
    secrets:
      OPENAI_API_KEY:
        required: true
      VERIFIER_CHECKOUT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Setup pinned verifier and inert submission intake
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      intake_sha256: ${{ steps.intake.outputs.intake_sha256 }}
      helper_base64: ${{ steps.transfer.outputs.helper_base64 }}
      helper_sha256: ${{ steps.transfer.outputs.helper_sha256 }}
      run_id: ${{ github.run_id }}
      package_artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-package","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.package.outputs.artifact-id, steps.package.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      intake_artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-intake","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.intake_archive.outputs.artifact-id, steps.intake_archive.outputs.artifact-digest, github.run_id, github.run_attempt) }}
    env:
      VERIFIER_REPOSITORY: ${{ inputs.verifier_repository }}
      VERIFIER_REVISION: ${{ inputs.verifier_revision }}
      CANDIDATE_REVISION: ${{ github.sha }}
      ROOT_DIR: ${{ inputs.root_dir }}
      CONFIG_PATH: ${{ inputs.config_path }}
      SUBMISSION_PATH: ${{ inputs.submission_path }}
      SCORE_PATH: ${{ inputs.score_path }}
      YUKON_EVALUATION: ${{ inputs.yukon_evaluation }}
      YUKON_ACCEPTED_RESULTS: ${{ inputs.yukon_accepted_results }}
      EVALUATION_RUN: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - name: Require immutable implementation revision before checkout
        env:
          CALLED_WORKFLOW: ${{ toJSON(job) }}
        shell: bash
        run: |
          [[ "$VERIFIER_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$VERIFIER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          python3 - <<'PY'
          import json, os
          called = json.loads(os.environ["CALLED_WORKFLOW"])
          if called.get("workflow_repository") != os.environ["VERIFIER_REPOSITORY"] or called.get("workflow_sha") != os.environ["VERIFIER_REVISION"]:
              raise SystemExit("Called workflow and implementation pins must match (GitHub.com job workflow identity required)")
          PY
      - name: Checkout actual dispatched challenge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: challenge
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout verifier explicitly (callee repository is not implicit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.verifier_repository }}
          ref: ${{ inputs.verifier_revision }}
          token: ${{ secrets.VERIFIER_CHECKOUT_TOKEN || github.token }}
          path: verifier
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Setup installable verifier wheel
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip wheel --no-deps ./verifier --wheel-dir "$RUNNER_TEMP/llmv-wheel"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/llmv-wheel/*.whl
      - name: Benchmark protected configuration and immutable intake
        id: intake
        shell: bash
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" workflow-prepare             --checkout "$GITHUB_WORKSPACE/challenge" --verifier-checkout "$GITHUB_WORKSPACE/verifier"             --candidate-revision "$CANDIDATE_REVISION" --verifier-revision "$VERIFIER_REVISION"             --root-dir "$ROOT_DIR" --config "$CONFIG_PATH" --submission "$SUBMISSION_PATH"             --score-path "$SCORE_PATH" --run-id "$EVALUATION_RUN" --out "$RUNNER_TEMP/intake/intake.json"
      - name: Export trusted standalone artifact transfer helper
        id: transfer
        shell: bash
        run: |
          python3 -I "$GITHUB_WORKSPACE/verifier/scripts/artifact_transfer.py" emit-bootstrap
      - name: Upload trusted package for credential-free execution jobs
        id: package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-package
          path: ${{ runner.temp }}/llmv-wheel/
          if-no-files-found: error
          retention-days: 7
      - name: Upload trusted intake
        id: intake_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-intake
          path: ${{ runner.temp }}/intake/
          if-no-files-found: error
          retention-days: 7

  experiments:
    name: Benchmark initial experiments (no judge or checkout secrets)
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-initial-experiments","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.phase_archive.outputs.artifact-id, steps.phase_archive.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      run_attempt: ${{ github.run_attempt }}
    env:
      LLMV_EXPECTED_INTAKE: ${{ needs.prepare.outputs.intake_sha256 }}
    steps:
      - name: Bootstrap trusted artifact transfer before wheel download
        env:
          LLMV_TRANSFER_HELPER: ${{ needs.prepare.outputs.helper_base64 }}
          LLMV_TRANSFER_SHA256: ${{ needs.prepare.outputs.helper_sha256 }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          encoded = os.environ["LLMV_TRANSFER_HELPER"]
          if not encoded or len(encoded) > 87384:
              raise SystemExit("Invalid transfer helper size")
          data = base64.b64decode(encoded, validate=True)
          if len(data) > 65536 or hashlib.sha256(data).hexdigest() != os.environ["LLMV_TRANSFER_SHA256"]:
              raise SystemExit("Invalid transfer helper digest")
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".llmv-artifact-transfer"
          root.mkdir()
          with (root / "transfer.py").open("xb") as target:
              target.write(data)
          PY
          python3 -I "$GITHUB_WORKSPACE/.llmv-artifact-transfer/transfer.py" install-action
      - name: Download and verify immutable phase artifacts
        uses: ./.llmv-artifact-transfer
        timeout-minutes: 4
        env:
          LLMV_ARTIFACTS: >-
            [
              {"artifact":${{ needs.prepare.outputs.package_artifact }},"path":"wheel"},
              {"artifact":${{ needs.prepare.outputs.intake_artifact }},"path":"intake"}
            ]
      - name: Setup verifier without package-network access
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Setup pinned isolated runtime
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" prepare-runtime --intake "$RUNNER_TEMP/intake/intake.json"
      - name: Benchmark initial immutable entrypoints
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" experiments --intake "$RUNNER_TEMP/intake/intake.json" --out "$RUNNER_TEMP/initial/initial.json"
      - id: phase_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-initial-experiments
          path: ${{ runner.temp }}/initial/
          if-no-files-found: error
          retention-days: 7

  initial_review:
    name: Benchmark initial judge or committee (no candidate execution)
    needs: [prepare, experiments]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-initial-review","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.phase_archive.outputs.artifact-id, steps.phase_archive.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      run_attempt: ${{ github.run_attempt }}
      kind: ${{ steps.review.outputs.kind }}
    env:
      LLMV_EXPECTED_INTAKE: ${{ needs.prepare.outputs.intake_sha256 }}
    steps:
      - name: Bootstrap trusted artifact transfer before wheel download
        env:
          LLMV_TRANSFER_HELPER: ${{ needs.prepare.outputs.helper_base64 }}
          LLMV_TRANSFER_SHA256: ${{ needs.prepare.outputs.helper_sha256 }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          encoded = os.environ["LLMV_TRANSFER_HELPER"]
          if not encoded or len(encoded) > 87384:
              raise SystemExit("Invalid transfer helper size")
          data = base64.b64decode(encoded, validate=True)
          if len(data) > 65536 or hashlib.sha256(data).hexdigest() != os.environ["LLMV_TRANSFER_SHA256"]:
              raise SystemExit("Invalid transfer helper digest")
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".llmv-artifact-transfer"
          root.mkdir()
          with (root / "transfer.py").open("xb") as target:
              target.write(data)
          PY
          python3 -I "$GITHUB_WORKSPACE/.llmv-artifact-transfer/transfer.py" install-action
      - name: Download and verify immutable phase artifacts
        uses: ./.llmv-artifact-transfer
        timeout-minutes: 4
        env:
          LLMV_ARTIFACTS: >-
            [
              {"artifact":${{ needs.prepare.outputs.package_artifact }},"path":"wheel"},
              {"artifact":${{ needs.prepare.outputs.intake_artifact }},"path":"intake"},
              {"artifact":${{ needs.experiments.outputs.artifact }},"path":"initial"}
            ]
      - name: Setup verifier without package-network access
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Benchmark credentialed initial review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" review-initial --intake "$RUNNER_TEMP/intake/intake.json" --initial "$RUNNER_TEMP/initial/initial.json" --out "$RUNNER_TEMP/review/review.json" --failure-out "$RUNNER_TEMP/review-failure/failure.json"
      - id: phase_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-initial-review
          path: ${{ runner.temp }}/review/
          if-no-files-found: error
          retention-days: 7

      - name: Retain initial review failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-initial-review-failure
          path: ${{ runner.temp }}/review-failure/failure.json
          if-no-files-found: ignore
          retention-days: 7

  followup:
    name: Benchmark optional follow-up batch (no secrets)
    needs: [prepare, experiments, initial_review]
    if: needs.initial_review.outputs.kind == 'followup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-followup","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.phase_archive.outputs.artifact-id, steps.phase_archive.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      run_attempt: ${{ github.run_attempt }}
    env:
      LLMV_EXPECTED_INTAKE: ${{ needs.prepare.outputs.intake_sha256 }}
    steps:
      - name: Bootstrap trusted artifact transfer before wheel download
        env:
          LLMV_TRANSFER_HELPER: ${{ needs.prepare.outputs.helper_base64 }}
          LLMV_TRANSFER_SHA256: ${{ needs.prepare.outputs.helper_sha256 }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          encoded = os.environ["LLMV_TRANSFER_HELPER"]
          if not encoded or len(encoded) > 87384:
              raise SystemExit("Invalid transfer helper size")
          data = base64.b64decode(encoded, validate=True)
          if len(data) > 65536 or hashlib.sha256(data).hexdigest() != os.environ["LLMV_TRANSFER_SHA256"]:
              raise SystemExit("Invalid transfer helper digest")
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".llmv-artifact-transfer"
          root.mkdir()
          with (root / "transfer.py").open("xb") as target:
              target.write(data)
          PY
          python3 -I "$GITHUB_WORKSPACE/.llmv-artifact-transfer/transfer.py" install-action
      - name: Download and verify immutable phase artifacts
        uses: ./.llmv-artifact-transfer
        timeout-minutes: 4
        env:
          LLMV_ARTIFACTS: >-
            [
              {"artifact":${{ needs.prepare.outputs.package_artifact }},"path":"wheel"},
              {"artifact":${{ needs.prepare.outputs.intake_artifact }},"path":"intake"},
              {"artifact":${{ needs.experiments.outputs.artifact }},"path":"initial"},
              {"artifact":${{ needs.initial_review.outputs.artifact }},"path":"review"}
            ]
      - name: Setup verifier without package-network access
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Setup pinned isolated runtime
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" prepare-runtime --phase followup --intake "$RUNNER_TEMP/intake/intake.json"
      - name: Benchmark immutable requested entrypoints
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" followup --intake "$RUNNER_TEMP/intake/intake.json" --initial "$RUNNER_TEMP/initial/initial.json" --initial-review "$RUNNER_TEMP/review/review.json" --out "$RUNNER_TEMP/followup/followup.json"
      - id: phase_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-followup
          path: ${{ runner.temp }}/followup/
          if-no-files-found: error
          retention-days: 7

  final_review:
    name: Benchmark final judge or committee (no further requests)
    needs: [prepare, experiments, initial_review, followup]
    if: needs.initial_review.outputs.kind == 'followup'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: >-
        ${{ format('{{"id":"{0}","name":"llmv-final-review","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.phase_archive.outputs.artifact-id, steps.phase_archive.outputs.artifact-digest, github.run_id, github.run_attempt) }}
      run_attempt: ${{ github.run_attempt }}
    env:
      LLMV_EXPECTED_INTAKE: ${{ needs.prepare.outputs.intake_sha256 }}
    steps:
      - name: Bootstrap trusted artifact transfer before wheel download
        env:
          LLMV_TRANSFER_HELPER: ${{ needs.prepare.outputs.helper_base64 }}
          LLMV_TRANSFER_SHA256: ${{ needs.prepare.outputs.helper_sha256 }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          encoded = os.environ["LLMV_TRANSFER_HELPER"]
          if not encoded or len(encoded) > 87384:
              raise SystemExit("Invalid transfer helper size")
          data = base64.b64decode(encoded, validate=True)
          if len(data) > 65536 or hashlib.sha256(data).hexdigest() != os.environ["LLMV_TRANSFER_SHA256"]:
              raise SystemExit("Invalid transfer helper digest")
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".llmv-artifact-transfer"
          root.mkdir()
          with (root / "transfer.py").open("xb") as target:
              target.write(data)
          PY
          python3 -I "$GITHUB_WORKSPACE/.llmv-artifact-transfer/transfer.py" install-action
      - name: Download and verify immutable phase artifacts
        uses: ./.llmv-artifact-transfer
        timeout-minutes: 4
        env:
          LLMV_ARTIFACTS: >-
            [
              {"artifact":${{ needs.prepare.outputs.package_artifact }},"path":"wheel"},
              {"artifact":${{ needs.prepare.outputs.intake_artifact }},"path":"intake"},
              {"artifact":${{ needs.experiments.outputs.artifact }},"path":"initial"},
              {"artifact":${{ needs.initial_review.outputs.artifact }},"path":"review"},
              {"artifact":${{ needs.followup.outputs.artifact }},"path":"followup"}
            ]
      - name: Setup verifier without package-network access
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Benchmark credentialed final review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" review-final --intake "$RUNNER_TEMP/intake/intake.json" --initial "$RUNNER_TEMP/initial/initial.json" --initial-review "$RUNNER_TEMP/review/review.json" --followup "$RUNNER_TEMP/followup/followup.json" --out "$RUNNER_TEMP/final-review/final-review.json" --failure-out "$RUNNER_TEMP/final-review-failure/failure.json"
      - id: phase_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-final-review
          path: ${{ runner.temp }}/final-review/
          if-no-files-found: error
          retention-days: 7

      - name: Retain final review failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: llmv-final-review-failure
          path: ${{ runner.temp }}/final-review-failure/failure.json
          if-no-files-found: ignore
          retention-days: 7

  finalize:
    name: Benchmark deterministic Yukon finalization
    needs: [prepare, experiments, initial_review, followup, final_review]
    if: ${{ always() && needs.prepare.result == 'success' && needs.experiments.result == 'success' && needs.initial_review.result == 'success' && (needs.initial_review.outputs.kind == 'judgment' || (needs.followup.result == 'success' && needs.final_review.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      dossier_artifact: >-
        ${{ format('{{"id":"{0}","name":"verifier-dossier","sha256":"{1}","run_id":"{2}","run_attempt":"{3}"}}', steps.dossier_archive.outputs.artifact-id, steps.dossier_archive.outputs.artifact-digest, github.run_id, github.run_attempt) }}
    env:
      LLMV_EXPECTED_INTAKE: ${{ needs.prepare.outputs.intake_sha256 }}
    steps:
      - name: Bootstrap trusted artifact transfer before wheel download
        env:
          LLMV_TRANSFER_HELPER: ${{ needs.prepare.outputs.helper_base64 }}
          LLMV_TRANSFER_SHA256: ${{ needs.prepare.outputs.helper_sha256 }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          encoded = os.environ["LLMV_TRANSFER_HELPER"]
          if not encoded or len(encoded) > 87384:
              raise SystemExit("Invalid transfer helper size")
          data = base64.b64decode(encoded, validate=True)
          if len(data) > 65536 or hashlib.sha256(data).hexdigest() != os.environ["LLMV_TRANSFER_SHA256"]:
              raise SystemExit("Invalid transfer helper digest")
          root = Path(os.environ["GITHUB_WORKSPACE"]) / ".llmv-artifact-transfer"
          root.mkdir()
          with (root / "transfer.py").open("xb") as target:
              target.write(data)
          PY
          python3 -I "$GITHUB_WORKSPACE/.llmv-artifact-transfer/transfer.py" install-action
      - name: Download and verify immutable phase artifacts
        uses: ./.llmv-artifact-transfer
        timeout-minutes: 4
        env:
          LLMV_ARTIFACTS: >-
            [
              {"artifact":${{ needs.prepare.outputs.package_artifact }},"path":"wheel"},
              {"artifact":${{ needs.prepare.outputs.intake_artifact }},"path":"intake"},
              {"artifact":${{ needs.experiments.outputs.artifact }},"path":"initial"},
              {"artifact":${{ needs.initial_review.outputs.artifact }},"path":"review"}
              ${{ needs.initial_review.outputs.kind == 'followup' && format(',{{"artifact":{0},"path":"followup"}},{{"artifact":{1},"path":"final-review"}}', needs.followup.outputs.artifact, needs.final_review.outputs.artifact) || '' }}
            ]
      - name: Setup verifier without package-network access
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/llmv-env"
          "$RUNNER_TEMP/llmv-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Benchmark exact selected judgment and score path
        env:
          SCORE_PATH: ${{ inputs.score_path }}
          REVIEW_KIND: ${{ needs.initial_review.outputs.kind }}
        shell: bash
        run: |
          extra=()
          if [[ "$REVIEW_KIND" == followup ]]; then
            extra=(--followup "$RUNNER_TEMP/followup/followup.json" --final-review "$RUNNER_TEMP/final-review/final-review.json")
          fi
          "$RUNNER_TEMP/llmv-env/bin/llm-verifier" finalize --intake "$RUNNER_TEMP/intake/intake.json" --initial "$RUNNER_TEMP/initial/initial.json" --initial-review "$RUNNER_TEMP/review/review.json" "${extra[@]}" --score-dir "$RUNNER_TEMP/score-artifact" --score-path "$SCORE_PATH" --dossier "$RUNNER_TEMP/dossier/dossier.json" --results "$RUNNER_TEMP/results/accepted-results.json"
      - name: Upload the only Yukon score artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: benchmark-score
          path: ${{ runner.temp }}/score-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload dossier separately
        id: dossier_archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verifier-dossier
          path: ${{ runner.temp }}/dossier/
          if-no-files-found: error
          retention-days: 30
      - name: Upload reusable accepted results separately (absent for invalid judgments)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verifier-accepted-results
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 90
