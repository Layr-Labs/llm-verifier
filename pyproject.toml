[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-verifier"
version = "0.6.0"
description = "Bounded, artifact-bound mathematical review with isolated evidence execution"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
llm-verifier = "llm_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_verifier = ["templates/*.yml", "templates/*.md", "templates/starter/*", "templates/starter/.gitignore", "templates/starter/submission/*"]

[tool.setuptools.data-files]
"share/llm-verifier/docs" = ["docs/solving.md"]
"share/llm-verifier/skills/llm-verifier-solver" = ["skills/llm-verifier-solver/SKILL.md"]
