[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-verifier"
version = "0.3.0a2"
description = "Bounded, artifact-bound mathematical review with isolated evidence execution"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
llm-verifier = "llm_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_verifier = ["templates/*.yml", "templates/starter/*", "templates/starter/.gitignore", "templates/starter/submission/*"]
